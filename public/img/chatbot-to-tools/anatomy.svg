<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f8a84"/></marker></defs>
  <rect width="1200" height="420" fill="#fbfbf9"/>
  <!-- layer 1 UI -->
  <rect x="200" y="40" width="800" height="54" rx="12" fill="#ffffff" stroke="#e4e8e4"/>
  <text x="230" y="73" font-size="16" fill="#182420" font-weight="700">chat panel</text>
  <text x="600" y="73" text-anchor="middle" font-size="13.5" fill="#7f8a84">React · beside the form · holds the whole conversation and sends it back every turn</text>
  <text x="960" y="73" text-anchor="end" font-size="12" fill="#a06b12" font-weight="600">thinnest layer</text>
  <path d="M600 96 v22" fill="none" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#g)"/>
  <!-- layer 2 backend -->
  <rect x="200" y="120" width="800" height="110" rx="12" fill="#ffffff" stroke="#e4e8e4"/>
  <text x="230" y="150" font-size="16" fill="#182420" font-weight="700">stateless backend</text>
  <text x="230" y="172" font-size="13.5" fill="#44524c">rebuilds the prompt from scratch every turn · calls Bedrock once · parses the answer into a typed action</text>
  <rect x="230" y="186" width="250" height="30" rx="8" fill="#eef1ee"/><text x="355" y="206" text-anchor="middle" font-size="13" fill="#44524c">Claude via the Bedrock API</text>
  <rect x="500" y="186" width="470" height="30" rx="8" fill="#e3f2ea"/><text x="735" y="206" text-anchor="middle" font-size="13" fill="#0e7a4d" font-weight="600">knowledge as YAML: prompts · partner notes · field docs · special flows</text>
  <path d="M600 232 v22" fill="none" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#g)"/>
  <!-- layer 3 tools -->
  <rect x="200" y="256" width="800" height="110" rx="12" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/>
  <text x="230" y="286" font-size="16" fill="#182420" font-weight="700">tools · plain code, no model inside</text>
  <text x="230" y="308" font-size="13.5" fill="#44524c">the model asks; code answers from the service and a cache</text>
  <g font-size="12.5" fill="#0e7a4d" font-weight="600">
    <rect x="230" y="322" width="170" height="28" rx="8" fill="#ffffff" stroke="#b9dcc9"/><text x="315" y="341" text-anchor="middle">partner currencies</text>
    <rect x="410" y="322" width="170" height="28" rx="8" fill="#ffffff" stroke="#b9dcc9"/><text x="495" y="341" text-anchor="middle">partner languages</text>
    <rect x="590" y="322" width="170" height="28" rx="8" fill="#ffffff" stroke="#b9dcc9"/><text x="675" y="341" text-anchor="middle">partner products</text>
    <rect x="770" y="322" width="200" height="28" rx="8" fill="#ffffff" stroke="#b9dcc9"/><text x="870" y="341" text-anchor="middle">required-field rules</text>
  </g>
  <text x="600" y="400" text-anchor="middle" font-size="14" fill="#7f8a84">green = what survived the pivot</text>
</svg>
