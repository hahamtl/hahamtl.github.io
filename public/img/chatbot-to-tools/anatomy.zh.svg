<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Avenir Next, Helvetica Neue, PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f8a84"/></marker></defs>
  <rect width="1200" height="420" fill="#fbfbf9"/>
  <!-- layer 1 UI -->
  <rect x="200" y="40" width="800" height="54" rx="12" fill="#ffffff" stroke="#e4e8e4"/>
  <text x="230" y="73" font-size="16" fill="#182420" font-weight="700">聊天面板</text>
  <text x="600" y="73" text-anchor="middle" font-size="13.5" fill="#7f8a84">React · 挂在表单旁 · 前端保存全部对话，每轮回传</text>
  <text x="960" y="73" text-anchor="end" font-size="12" fill="#a06b12" font-weight="600">最薄的一层</text>
  <path d="M600 96 v22" fill="none" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#g)"/>
  <!-- layer 2 backend -->
  <rect x="200" y="120" width="800" height="110" rx="12" fill="#ffffff" stroke="#e4e8e4"/>
  <text x="230" y="150" font-size="16" fill="#182420" font-weight="700">无状态后端</text>
  <text x="230" y="172" font-size="13.5" fill="#44524c">每轮从零重建 prompt · 调一次 Bedrock · 把回答解析成 typed action</text>
  <rect x="230" y="186" width="250" height="30" rx="8" fill="#eef1ee"/><text x="355" y="206" text-anchor="middle" font-size="13" fill="#44524c">通过 Bedrock API 调 Claude</text>
  <rect x="500" y="186" width="470" height="30" rx="8" fill="#e3f2ea"/><text x="735" y="206" text-anchor="middle" font-size="13" fill="#0e7a4d" font-weight="600">知识全是 YAML：prompt · partner 备注 · 字段文档 · special flow</text>
  <path d="M600 232 v22" fill="none" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#g)"/>
  <!-- layer 3 tools -->
  <rect x="200" y="256" width="800" height="110" rx="12" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/>
  <text x="230" y="286" font-size="16" fill="#182420" font-weight="700">工具 · 纯代码，里面没有模型</text>
  <text x="230" y="308" font-size="13.5" fill="#44524c">模型来问，代码从服务和缓存里答</text>
  <g font-size="12.5" fill="#0e7a4d" font-weight="600">
    <rect x="230" y="322" width="170" height="28" rx="8" fill="#ffffff" stroke="#b9dcc9"/><text x="315" y="341" text-anchor="middle">partner 货币</text>
    <rect x="410" y="322" width="170" height="28" rx="8" fill="#ffffff" stroke="#b9dcc9"/><text x="495" y="341" text-anchor="middle">partner 语言</text>
    <rect x="590" y="322" width="170" height="28" rx="8" fill="#ffffff" stroke="#b9dcc9"/><text x="675" y="341" text-anchor="middle">partner 产品</text>
    <rect x="770" y="322" width="200" height="28" rx="8" fill="#ffffff" stroke="#b9dcc9"/><text x="870" y="341" text-anchor="middle">必填字段规则</text>
  </g>
  <text x="600" y="400" text-anchor="middle" font-size="14" fill="#7f8a84">绿色 = 转型后留下来的部分</text>
</svg>
