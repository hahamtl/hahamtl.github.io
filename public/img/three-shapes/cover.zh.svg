<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Avenir Next, Helvetica Neue, PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7a4d"/></marker>
  </defs>
  <rect width="1200" height="460" fill="#fbfbf9"/>

  <!-- Shape one -->
  <text x="200" y="48" text-anchor="middle" font-size="15" letter-spacing="2" fill="#7f8a84" font-weight="600">形态一</text>
  <text x="200" y="76" text-anchor="middle" font-size="21" fill="#182420" font-weight="700">围着 API 手写循环</text>
  <text x="200" y="96" text-anchor="middle" font-size="12.5" fill="#7f8a84">例：Bedrock API + 自己的代码</text>
  <rect x="50" y="104" width="300" height="270" rx="16" fill="#ffffff" stroke="#e4e8e4"/>
  <text x="200" y="134" text-anchor="middle" font-size="13" fill="#7f8a84">你的代码</text>
  <rect x="80" y="150" width="240" height="34" rx="8" fill="#e3f2ea"/><text x="200" y="173" text-anchor="middle" font-size="14" fill="#0e7a4d" font-weight="600">对话存储</text>
  <rect x="80" y="192" width="240" height="34" rx="8" fill="#e3f2ea"/><text x="200" y="215" text-anchor="middle" font-size="14" fill="#0e7a4d" font-weight="600">工具路由 · 队列 · 重试</text>
  <rect x="80" y="234" width="240" height="34" rx="8" fill="#e3f2ea"/><text x="200" y="257" text-anchor="middle" font-size="14" fill="#0e7a4d" font-weight="600">日志 · "做完了吗"</text>
  <rect x="110" y="300" width="180" height="48" rx="10" fill="#182420"/><text x="200" y="330" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600">Bedrock API</text>
  <path d="M80 324 C40 324 40 210 80 210" fill="none" stroke="#0e7a4d" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="200" y="408" text-anchor="middle" font-size="14" fill="#4a5651">循环归你维护</text>

  <!-- Shape two -->
  <text x="600" y="48" text-anchor="middle" font-size="15" letter-spacing="2" fill="#7f8a84" font-weight="600">形态二</text>
  <text x="600" y="76" text-anchor="middle" font-size="21" fill="#182420" font-weight="700">托管 runtime</text>
  <text x="600" y="96" text-anchor="middle" font-size="12.5" fill="#7f8a84">例：Bedrock AgentCore</text>
  <rect x="450" y="104" width="300" height="270" rx="16" fill="#eef1ee" stroke="#e4e8e4"/>
  <text x="600" y="134" text-anchor="middle" font-size="13" fill="#7f8a84">别人的 runtime</text>
  <text x="600" y="162" text-anchor="middle" font-size="13" fill="#7f8a84">会话 · 记忆 · 工具调用 · 身份</text>
  <rect x="490" y="186" width="220" height="150" rx="12" fill="#ffffff" stroke="#0e7a4d" stroke-width="2"/>
  <text x="600" y="214" text-anchor="middle" font-size="13" fill="#7f8a84">你带来的</text>
  <rect x="512" y="230" width="176" height="30" rx="7" fill="#e3f2ea"/><text x="600" y="250" text-anchor="middle" font-size="14" fill="#0e7a4d" font-weight="600">指令</text>
  <rect x="512" y="268" width="176" height="30" rx="7" fill="#e3f2ea"/><text x="600" y="288" text-anchor="middle" font-size="14" fill="#0e7a4d" font-weight="600">工具契约</text>
  <text x="600" y="322" text-anchor="middle" font-size="12" fill="#4a5651">+ 什么时候停下来问人</text>
  <text x="600" y="408" text-anchor="middle" font-size="14" fill="#4a5651">循环是一条边界</text>

  <!-- Shape three -->
  <text x="1000" y="48" text-anchor="middle" font-size="15" letter-spacing="2" fill="#7f8a84" font-weight="600">形态三</text>
  <text x="1000" y="76" text-anchor="middle" font-size="21" fill="#182420" font-weight="700">一个插件里的文本</text>
  <text x="1000" y="96" text-anchor="middle" font-size="12.5" fill="#7f8a84">例：Claude Code 插件</text>
  <rect x="850" y="104" width="300" height="270" rx="16" fill="#ffffff" stroke="#e4e8e4"/>
  <text x="1000" y="134" text-anchor="middle" font-size="13" fill="#7f8a84">用户本来就在用的助手</text>
  <!-- folder -->
  <path d="M905 170 h70 l14 14 h106 a10 10 0 0 1 10 10 v120 a10 10 0 0 1 -10 10 h-190 a10 10 0 0 1 -10 -10 v-134 a10 10 0 0 1 10 -10z" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/>
  <rect x="925" y="204" width="150" height="22" rx="5" fill="#ffffff"/><text x="1000" y="220" text-anchor="middle" font-size="12" fill="#182420" font-family="ui-monospace, SF Mono, Menlo, monospace">instructions.md</text>
  <rect x="925" y="234" width="150" height="22" rx="5" fill="#ffffff"/><text x="1000" y="250" text-anchor="middle" font-size="12" fill="#182420" font-family="ui-monospace, SF Mono, Menlo, monospace">tools.json</text>
  <rect x="925" y="264" width="150" height="22" rx="5" fill="#ffffff"/><text x="1000" y="280" text-anchor="middle" font-size="12" fill="#182420" font-family="ui-monospace, SF Mono, Menlo, monospace">check.sh</text>
  <circle cx="1000" cy="345" r="14" fill="#182420"/><text x="1000" y="350" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">?</text>
  <text x="1000" y="408" text-anchor="middle" font-size="14" fill="#4a5651">每次写入前由人决定</text>

  <!-- arrows between shapes -->
  <path d="M362 240 h70" fill="none" stroke="#0e7a4d" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M762 240 h70" fill="none" stroke="#0e7a4d" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="600" y="446" text-anchor="middle" font-size="14" fill="#7f8a84">你要写的越来越少：代码 → 配置 → 指令</text>
</svg>
