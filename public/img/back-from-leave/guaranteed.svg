<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <rect width="1200" height="420" fill="#fbfbf9"/>
  <!-- old -->
  <text x="300" y="44" text-anchor="middle" font-size="13" letter-spacing="2" fill="#7f8a84" font-weight="600">OLD RUNTIME · WHOLE FILE INJECTED</text>
  <rect x="120" y="66" width="360" height="270" rx="14" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/>
  <text x="300" y="92" text-anchor="middle" font-size="12" fill="#0e7a4d" font-weight="700">everything below is read, every turn</text>
  <g font-size="13" fill="#182420">
    <rect x="140" y="106" width="320" height="40" rx="8" fill="#ffffff"/><text x="300" y="131" text-anchor="middle">short description</text>
    <rect x="140" y="154" width="320" height="40" rx="8" fill="#ffffff"/><text x="300" y="179" text-anchor="middle" fill="#7f8a84">context, examples…</text>
    <rect x="140" y="202" width="320" height="40" rx="8" fill="#ffffff"/><text x="300" y="227" text-anchor="middle" fill="#7f8a84">more context…</text>
    <rect x="140" y="250" width="320" height="40" rx="8" fill="#ffffff" stroke="#0e7a4d" stroke-width="2"/><text x="300" y="275" text-anchor="middle" font-weight="700">"never set status to ready"</text>
    <text x="300" y="318" text-anchor="middle" font-size="12" fill="#0e7a4d" font-weight="600">hard rule near the bottom: guaranteed</text>
  </g>
  <!-- new -->
  <text x="900" y="44" text-anchor="middle" font-size="13" letter-spacing="2" fill="#a06b12" font-weight="600">NEW RUNTIME · BODY ON DEMAND</text>
  <rect x="720" y="66" width="360" height="52" rx="14" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/>
  <text x="900" y="88" text-anchor="middle" font-size="12" fill="#0e7a4d" font-weight="700">always loaded</text>
  <text x="900" y="106" text-anchor="middle" font-size="13" fill="#182420">short description</text>
  <rect x="720" y="130" width="360" height="206" rx="14" fill="#f4f6f4" stroke="#c9d0cb" stroke-dasharray="6 4"/>
  <text x="900" y="152" text-anchor="middle" font-size="12" fill="#7f8a84" font-weight="700">loaded only if the model asks</text>
  <g font-size="13">
    <rect x="740" y="166" width="320" height="40" rx="8" fill="#ffffff" stroke="#e4e8e4"/><text x="900" y="191" text-anchor="middle" fill="#7f8a84">context, examples…</text>
    <rect x="740" y="214" width="320" height="40" rx="8" fill="#ffffff" stroke="#e4e8e4"/><text x="900" y="239" text-anchor="middle" fill="#7f8a84">more context…</text>
    <rect x="740" y="262" width="320" height="40" rx="8" fill="#f8e6e6" stroke="#a13333" stroke-width="2"/><text x="900" y="287" text-anchor="middle" fill="#a13333" font-weight="700">"never set status to ready"</text>
    <text x="900" y="322" text-anchor="middle" font-size="12" fill="#a13333" font-weight="600">same rule, now merely available · often never read</text>
  </g>
  <rect x="120" y="360" width="960" height="44" rx="10" fill="#faf0da" stroke="#a06b12"/>
  <text x="600" y="388" text-anchor="middle" font-size="13" fill="#182420"><tspan font-weight="700">the fix:</tspan> move load-bearing rules into the always-loaded layer · make the description a decisive router ("read the body when…")</text>
</svg>
