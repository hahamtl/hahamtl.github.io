<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7a4d"/></marker></defs>
  <rect width="1200" height="440" fill="#fbfbf9"/>
  <rect x="60" y="40" width="1080" height="54" rx="12" fill="#182420"/>
  <text x="600" y="74" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="700">the product: same chat surface, same assistants, same names</text>
  <text x="300" y="130" text-anchor="middle" font-size="13" letter-spacing="2" fill="#7f8a84" font-weight="600">BEFORE LEAVE</text>
  <text x="900" y="130" text-anchor="middle" font-size="13" letter-spacing="2" fill="#0e7a4d" font-weight="600">THREE WEEKS LATER</text>
  <g font-size="14">
    <rect x="60" y="146" width="480" height="52" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="300" y="178" text-anchor="middle" fill="#44524c">runtime: an in-process API loop we wrote</text>
    <rect x="660" y="146" width="480" height="52" rx="10" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="1.5"/><text x="900" y="178" text-anchor="middle" fill="#182420">managed runtime · config + persona per agent</text>
    <rect x="60" y="210" width="480" height="52" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="300" y="242" text-anchor="middle" fill="#44524c">instructions: copies inside the app repo</text>
    <rect x="660" y="210" width="480" height="52" rx="10" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="1.5"/><text x="900" y="242" text-anchor="middle" fill="#182420">a shared instructions repo, the only home</text>
    <rect x="60" y="274" width="480" height="52" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="300" y="306" text-anchor="middle" fill="#44524c">integrations: each agent wired its own</text>
    <rect x="660" y="274" width="480" height="52" rx="10" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="1.5"/><text x="900" y="306" text-anchor="middle" fill="#182420">one shared tools server in between</text>
    <rect x="60" y="338" width="480" height="52" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="300" y="370" text-anchor="middle" fill="#44524c">loading: whole instruction file, every turn</text>
    <rect x="660" y="338" width="480" height="52" rx="10" fill="#faf0da" stroke="#a06b12" stroke-width="1.5"/><text x="900" y="370" text-anchor="middle" fill="#182420">description always · body on demand</text>
  </g>
  <g fill="none" stroke="#0e7a4d" stroke-width="2" marker-end="url(#g)"><path d="M548 172 h104"/><path d="M548 236 h104"/><path d="M548 300 h104"/><path d="M548 364 h104"/></g>
  <text x="600" y="420" text-anchor="middle" font-size="13" fill="#7f8a84">about twenty merged changes · every layer replaced · none of the reasons in my head</text>
