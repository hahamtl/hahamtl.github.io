<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="Avenir Next, Helvetica Neue, PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <rect width="1200" height="360" fill="#fbfbf9"/>
  <text x="80" y="44" font-size="13" letter-spacing="2" fill="#7f8a84" font-weight="600">问题</text>
  <text x="80" y="68" font-size="14" fill="#182420">一个 thread 提到两张工单 · Agent 默默处理了最早看到的那张</text>
  <g font-size="13" fill="#182420">
    <rect x="80" y="100" width="330" height="190" rx="14" fill="#ffffff" stroke="#e4e8e4"/>
    <text x="245" y="128" text-anchor="middle" font-size="12" letter-spacing="2" fill="#7f8a84" font-weight="600">第一版 · 更聪明</text>
    <text x="245" y="156" text-anchor="middle" font-weight="700">让模型挑最可能的那张</text>
    <text x="245" y="182" text-anchor="middle" fill="#44524c" font-size="12.5">多数时候能选对</text>
    <text x="245" y="202" text-anchor="middle" fill="#44524c" font-size="12.5">但这是个功能：鼓励人说话含糊</text>
    <rect x="165" y="230" width="160" height="30" rx="15" fill="#f8e6e6"/><text x="245" y="250" text-anchor="middle" fill="#a13333" font-weight="700" font-size="12.5">开工前被否</text>
    <rect x="435" y="100" width="330" height="190" rx="14" fill="#ffffff" stroke="#e4e8e4"/>
    <text x="600" y="128" text-anchor="middle" font-size="12" letter-spacing="2" fill="#7f8a84" font-weight="600">第二版 · 更严</text>
    <text x="600" y="156" text-anchor="middle" font-weight="700">拦住，追问是哪一张</text>
    <text x="600" y="182" text-anchor="middle" fill="#44524c" font-size="12.5">不猜</text>
    <text x="600" y="202" text-anchor="middle" fill="#44524c" font-size="12.5">历史从不重置：一条旧提及把它永久卡死</text>
    <rect x="530" y="230" width="140" height="30" rx="15" fill="#f8e6e6"/><text x="600" y="250" text-anchor="middle" fill="#a13333" font-weight="700" font-size="12.5">回滚</text>
    <rect x="790" y="100" width="330" height="190" rx="14" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/>
    <text x="955" y="128" text-anchor="middle" font-size="12" letter-spacing="2" fill="#0e7a4d" font-weight="600">第三版 · 说出来</text>
    <text x="955" y="156" text-anchor="middle" font-weight="700">原来的锁不动，每次说出来</text>
    <rect x="810" y="172" width="290" height="34" rx="8" fill="#ffffff" stroke="#b9dcc9"/><text x="955" y="194" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SF Mono, Menlo, monospace">正在处理 ABC-123 · 修复导出超时</text>
    <text x="955" y="222" text-anchor="middle" fill="#44524c" font-size="12.5">还是猜，但看得见 · 下一条消息就能纠正</text>
    <rect x="895" y="240" width="120" height="30" rx="15" fill="#0e7a4d"/><text x="955" y="260" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="12.5">上线</text>
  </g>
  <text x="600" y="330" text-anchor="middle" font-size="13" fill="#7f8a84">五天 · 三个设计 · 上线的那个一行逻辑没改</text>
</svg>
