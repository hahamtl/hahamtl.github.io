<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <rect width="1200" height="360" fill="#fbfbf9"/>
  <text x="80" y="44" font-size="13" letter-spacing="2" fill="#7f8a84" font-weight="600">THE BUG</text>
  <text x="80" y="68" font-size="14" fill="#182420">a thread mentions two work items · the agent silently acts on the first one it saw</text>
  <g font-size="13" fill="#182420">
    <rect x="80" y="100" width="330" height="190" rx="14" fill="#ffffff" stroke="#e4e8e4"/>
    <text x="245" y="128" text-anchor="middle" font-size="12" letter-spacing="2" fill="#7f8a84" font-weight="600">ATTEMPT 1 · SMARTER</text>
    <text x="245" y="156" text-anchor="middle" font-weight="700">let the model pick the likely one</text>
    <text x="245" y="182" text-anchor="middle" fill="#44524c" font-size="12.5">works most of the time</text>
    <text x="245" y="202" text-anchor="middle" fill="#44524c" font-size="12.5">but it is a feature: it invites vagueness</text>
    <rect x="165" y="230" width="160" height="30" rx="15" fill="#f8e6e6"/><text x="245" y="250" text-anchor="middle" fill="#a13333" font-weight="700" font-size="12.5">rejected before build</text>
    <rect x="435" y="100" width="330" height="190" rx="14" fill="#ffffff" stroke="#e4e8e4"/>
    <text x="600" y="128" text-anchor="middle" font-size="12" letter-spacing="2" fill="#7f8a84" font-weight="600">ATTEMPT 2 · STRICTER</text>
    <text x="600" y="156" text-anchor="middle" font-weight="700">block and ask which one</text>
    <text x="600" y="182" text-anchor="middle" fill="#44524c" font-size="12.5">no guessing</text>
    <text x="600" y="202" text-anchor="middle" fill="#44524c" font-size="12.5">history never resets: one old mention jams it forever</text>
    <rect x="530" y="230" width="140" height="30" rx="15" fill="#f8e6e6"/><text x="600" y="250" text-anchor="middle" fill="#a13333" font-weight="700" font-size="12.5">rolled back</text>
    <rect x="790" y="100" width="330" height="190" rx="14" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/>
    <text x="955" y="128" text-anchor="middle" font-size="12" letter-spacing="2" fill="#0e7a4d" font-weight="600">ATTEMPT 3 · LOUDER</text>
    <text x="955" y="156" text-anchor="middle" font-weight="700">same lock, said out loud every time</text>
    <rect x="810" y="172" width="290" height="34" rx="8" fill="#ffffff" stroke="#b9dcc9"/><text x="955" y="194" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SF Mono, Menlo, monospace">Working on ABC-123 · Fix export timeout</text>
    <text x="955" y="222" text-anchor="middle" fill="#44524c" font-size="12.5">still a guess, but visible · fixed in the next message</text>
    <rect x="895" y="240" width="120" height="30" rx="15" fill="#0e7a4d"/><text x="955" y="260" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="12.5">shipped</text>
  </g>
  <text x="600" y="330" text-anchor="middle" font-size="13" fill="#7f8a84">five days · three designs · the one that shipped changed no logic</text>
</svg>
