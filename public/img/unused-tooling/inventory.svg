<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <rect width="1200" height="440" fill="#fbfbf9"/>
  <text x="60" y="48" font-size="13" letter-spacing="2" fill="#7f8a84" font-weight="600">THE TOOLING AROUND THE AGENT</text>
  <text x="640" y="48" font-size="13" letter-spacing="2" fill="#7f8a84" font-weight="600">OPENED IN THE LAST 30 DAYS BY</text>
  <text x="1000" y="48" font-size="13" letter-spacing="2" fill="#7f8a84" font-weight="600">DECISION</text>
  <g font-size="14.5" fill="#182420">
    <!-- row template: y -->
    <rect x="60" y="70" width="540" height="44" rx="10" fill="#ffffff" stroke="#e4e8e4"/><text x="80" y="98">ticket → plan commands</text>
    <rect x="640" y="70" width="320" height="44" rx="10" fill="#e3f2ea"/><text x="800" y="98" text-anchor="middle" fill="#0e7a4d" font-weight="600">every user · daily</text>
    <rect x="1000" y="70" width="140" height="44" rx="10" fill="#0e7a4d"/><text x="1070" y="98" text-anchor="middle" fill="#ffffff" font-weight="700">kept</text>

    <rect x="60" y="124" width="540" height="44" rx="10" fill="#ffffff" stroke="#e4e8e4"/><text x="80" y="152">help command</text>
    <rect x="640" y="124" width="320" height="44" rx="10" fill="#e3f2ea"/><text x="800" y="152" text-anchor="middle" fill="#0e7a4d" font-weight="600">everyone · and it was slow</text>
    <rect x="1000" y="124" width="140" height="44" rx="10" fill="#0e7a4d"/><text x="1070" y="152" text-anchor="middle" fill="#ffffff" font-weight="700">kept · made instant</text>

    <rect x="60" y="178" width="540" height="44" rx="10" fill="#ffffff" stroke="#e4e8e4"/><text x="80" y="206">progress dashboard</text>
    <rect x="640" y="178" width="320" height="44" rx="10" fill="#faf0da"/><text x="800" y="206" text-anchor="middle" fill="#a06b12" font-weight="600">the three builders</text>
    <rect x="1000" y="178" width="140" height="44" rx="10" fill="#f8e6e6" stroke="#a13333"/><text x="1070" y="206" text-anchor="middle" fill="#a13333" font-weight="700">dropped</text>

    <rect x="60" y="232" width="540" height="44" rx="10" fill="#ffffff" stroke="#e4e8e4"/><text x="80" y="260">feedback scaffolding flow</text>
    <rect x="640" y="232" width="320" height="44" rx="10" fill="#faf0da"/><text x="800" y="260" text-anchor="middle" fill="#a06b12" font-weight="600">the three builders</text>
    <rect x="1000" y="232" width="140" height="44" rx="10" fill="#f8e6e6" stroke="#a13333"/><text x="1070" y="260" text-anchor="middle" fill="#a13333" font-weight="700">dropped</text>

    <rect x="60" y="286" width="540" height="44" rx="10" fill="#ffffff" stroke="#e4e8e4"/><text x="80" y="314">sandbox protocol</text>
    <rect x="640" y="286" width="320" height="44" rx="10" fill="#eef1ee"/><text x="800" y="314" text-anchor="middle" fill="#7f8a84" font-weight="600">one builder · twice</text>
    <rect x="1000" y="286" width="140" height="44" rx="10" fill="#f8e6e6" stroke="#a13333"/><text x="1070" y="314" text-anchor="middle" fill="#a13333" font-weight="700">dropped</text>

    <rect x="60" y="340" width="540" height="44" rx="10" fill="#ffffff" stroke="#e4e8e4"/><text x="80" y="368">helper scripts (env check, install)</text>
    <rect x="640" y="340" width="320" height="44" rx="10" fill="#eef1ee"/><text x="800" y="368" text-anchor="middle" fill="#7f8a84" font-weight="600">nobody · they ran themselves</text>
    <rect x="1000" y="340" width="140" height="44" rx="10" fill="#f8e6e6" stroke="#a13333"/><text x="1070" y="368" text-anchor="middle" fill="#a13333" font-weight="700">dropped</text>
  </g>
  <text x="600" y="418" text-anchor="middle" font-size="14" fill="#7f8a84">the plugin shipped smaller than the repository it came from · nobody asked where anything went</text>
</svg>
