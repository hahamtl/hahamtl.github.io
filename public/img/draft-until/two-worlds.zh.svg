<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Avenir Next, Helvetica Neue, PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7a4d"/></marker>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a06b12"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9d0cb"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#fbfbf9"/>

  <!-- world 1 -->
  <rect x="300" y="60" width="330" height="400" rx="18" fill="#ffffff" stroke="#e4e8e4"/>
  <text x="465" y="96" text-anchor="middle" font-size="14" letter-spacing="2" fill="#7f8a84" font-weight="600">世界一</text>
  <text x="465" y="124" text-anchor="middle" font-size="22" fill="#182420" font-weight="700">存在的东西</text>
  <!-- world 2 -->
  <rect x="690" y="60" width="330" height="400" rx="18" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="1.5"/>
  <text x="855" y="96" text-anchor="middle" font-size="14" letter-spacing="2" fill="#0e7a4d" font-weight="600">世界二</text>
  <text x="855" y="124" text-anchor="middle" font-size="22" fill="#182420" font-weight="700">算数的东西</text>

  <!-- agent -->
  <rect x="40" y="200" width="180" height="70" rx="14" fill="#182420"/>
  <text x="130" y="230" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="700">Agent</text>
  <text x="130" y="252" text-anchor="middle" font-size="13" fill="#cfd8d3">写入</text>
  <path d="M222 235 h70" fill="none" stroke="#0e7a4d" stroke-width="2.5" marker-end="url(#g)"/>

  <!-- draft artifacts -->
  <g>
    <rect x="335" y="160" width="260" height="46" rx="10" fill="#f4f6f4" stroke="#c9d0cb" stroke-dasharray="5 4"/>
    <text x="352" y="189" font-size="14" fill="#44524c">测试用例</text>
    <rect x="500" y="171" width="78" height="24" rx="12" fill="#eef1ee"/><text x="539" y="188" text-anchor="middle" font-size="11.5" fill="#7f8a84" font-weight="700">草稿</text>
  </g>
  <g>
    <rect x="335" y="216" width="260" height="46" rx="10" fill="#f4f6f4" stroke="#c9d0cb" stroke-dasharray="5 4"/>
    <text x="352" y="245" font-size="14" fill="#44524c">PR</text>
    <rect x="500" y="227" width="78" height="24" rx="12" fill="#eef1ee"/><text x="539" y="244" text-anchor="middle" font-size="11.5" fill="#7f8a84" font-weight="700">草稿</text>
  </g>
  <g>
    <rect x="335" y="272" width="260" height="46" rx="10" fill="#f4f6f4" stroke="#c9d0cb" stroke-dasharray="5 4"/>
    <text x="352" y="301" font-size="14" fill="#44524c">工单备注</text>
    <rect x="500" y="283" width="78" height="24" rx="12" fill="#eef1ee"/><text x="539" y="300" text-anchor="middle" font-size="11.5" fill="#7f8a84" font-weight="700">AI 字段</text>
  </g>
  <g>
    <rect x="335" y="328" width="260" height="46" rx="10" fill="#f4f6f4" stroke="#c9d0cb" stroke-dasharray="5 4"/>
    <text x="352" y="357" font-size="14" fill="#44524c">消息</text>
    <rect x="490" y="339" width="88" height="24" rx="12" fill="#eef1ee"/><text x="534" y="356" text-anchor="middle" font-size="11.5" fill="#7f8a84" font-weight="700">私有频道</text>
  </g>
  <text x="465" y="420" text-anchor="middle" font-size="13" fill="#7f8a84">每条都带一个状态字段</text>
  <text x="465" y="440" text-anchor="middle" font-size="13" fill="#7f8a84">Agent 永远不碰它</text>

  <!-- promote arrow -->
  <path d="M632 267 h50" fill="none" stroke="#a06b12" stroke-width="3" marker-end="url(#y)"/>
  <rect x="598" y="290" width="118" height="54" rx="12" fill="#faf0da" stroke="#a06b12" stroke-width="1.5"/>
  <text x="657" y="313" text-anchor="middle" font-size="14" fill="#182420" font-weight="700">人</text>
  <text x="657" y="331" text-anchor="middle" font-size="12.5" fill="#a06b12">提升</text>

  <!-- promoted artifacts -->
  <rect x="725" y="160" width="260" height="46" rx="10" fill="#ffffff" stroke="#0e7a4d" stroke-width="1.5"/>
  <text x="742" y="189" font-size="14" fill="#182420">测试用例</text>
  <rect x="900" y="171" width="68" height="24" rx="12" fill="#0e7a4d"/><text x="934" y="188" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="700">就绪</text>
  <rect x="725" y="216" width="260" height="46" rx="10" fill="#ffffff" stroke="#0e7a4d" stroke-width="1.5"/>
  <text x="742" y="245" font-size="14" fill="#182420">PR</text>
  <rect x="880" y="227" width="88" height="24" rx="12" fill="#0e7a4d"/><text x="924" y="244" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="700">待评审</text>
  <rect x="725" y="272" width="260" height="46" rx="10" fill="#ffffff" stroke="#0e7a4d" stroke-width="1.5"/>
  <text x="742" y="301" font-size="14" fill="#182420">工单描述</text>
  <rect x="890" y="283" width="78" height="24" rx="12" fill="#0e7a4d"/><text x="929" y="300" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="700">已合并</text>
  <rect x="725" y="328" width="260" height="46" rx="10" fill="#ffffff" stroke="#0e7a4d" stroke-width="1.5"/>
  <text x="742" y="357" font-size="14" fill="#182420">消息</text>
  <rect x="872" y="339" width="96" height="24" rx="12" fill="#0e7a4d"/><text x="920" y="356" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="700">团队频道</text>

  <!-- consumers -->
  <rect x="1060" y="150" width="110" height="46" rx="10" fill="#ffffff" stroke="#e4e8e4"/><text x="1115" y="179" text-anchor="middle" font-size="13" fill="#44524c">报表</text>
  <rect x="1060" y="212" width="110" height="46" rx="10" fill="#ffffff" stroke="#e4e8e4"/><text x="1115" y="241" text-anchor="middle" font-size="13" fill="#44524c">流水线</text>
  <rect x="1060" y="274" width="110" height="46" rx="10" fill="#ffffff" stroke="#e4e8e4"/><text x="1115" y="303" text-anchor="middle" font-size="13" fill="#44524c">团队</text>
  <rect x="1060" y="336" width="110" height="46" rx="10" fill="#ffffff" stroke="#e4e8e4"/><text x="1115" y="365" text-anchor="middle" font-size="13" fill="#44524c">受众</text>
  <path d="M1022 267 h30" fill="none" stroke="#0e7a4d" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="1115" y="410" text-anchor="middle" font-size="13" fill="#7f8a84">下游只读</text>
  <text x="1115" y="428" text-anchor="middle" font-size="13" fill="#7f8a84">世界二</text>

  <text x="600" y="500" text-anchor="middle" font-size="14" fill="#7f8a84">Agent 可以让东西存在 · 只有人能让它算数</text>
</svg>
