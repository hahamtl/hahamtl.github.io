<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="Avenir Next, Helvetica Neue, PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7a4d"/></marker></defs>
  <rect width="1200" height="480" fill="#fbfbf9"/>
  <!-- brain -->
  <rect x="440" y="170" width="320" height="120" rx="16" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/>
  <text x="600" y="204" text-anchor="middle" font-size="13" letter-spacing="2" fill="#0e7a4d" font-weight="600">脑子</text>
  <text x="600" y="232" text-anchor="middle" font-size="18" fill="#182420" font-weight="700">一份技能文件</text>
  <text x="600" y="256" text-anchor="middle" font-size="13" fill="#44524c">读什么 · 决定什么 · 产出什么</text>
  <text x="600" y="274" text-anchor="middle" font-size="12.5" fill="#7f8a84">共享，几乎不改</text>
  <path d="M436 230 h-16" fill="none" stroke="#0e7a4d" stroke-width="2.5" marker-end="url(#g)"/>
  <path d="M764 230 h16" fill="none" stroke="#0e7a4d" stroke-width="2.5" marker-end="url(#g)"/>

  <!-- left body -->
  <rect x="40" y="60" width="370" height="360" rx="18" fill="#ffffff" stroke="#e4e8e4"/>
  <text x="225" y="94" text-anchor="middle" font-size="13" letter-spacing="2" fill="#7f8a84" font-weight="600">交互式身体</text>
  <text x="225" y="122" text-anchor="middle" font-size="19" fill="#182420" font-weight="700">终端前的人</text>
  <g font-size="13.5" fill="#182420">
    <rect x="70" y="146" width="310" height="40" rx="9" fill="#faf0da" stroke="#e5cf9c"/><text x="225" y="172" text-anchor="middle">有人实时读每一行</text>
    <rect x="70" y="196" width="310" height="40" rx="9" fill="#f4f6f4"/><text x="225" y="222" text-anchor="middle">可以提问 · 合成一轮</text>
    <rect x="70" y="246" width="310" height="40" rx="9" fill="#f4f6f4"/><text x="225" y="272" text-anchor="middle">每次写入前一个 gate</text>
    <rect x="70" y="296" width="310" height="40" rx="9" fill="#f4f6f4"/><text x="225" y="322" text-anchor="middle">状态必须和现实一致 · 选择说出来</text>
    <rect x="70" y="346" width="310" height="40" rx="9" fill="#f4f6f4"/><text x="225" y="372" text-anchor="middle">做完 = 人说完才完</text>
  </g>
  <text x="225" y="408" text-anchor="middle" font-size="12.5" fill="#7f8a84">适合：笔记本上的助手</text>

  <!-- right body -->
  <rect x="790" y="60" width="370" height="360" rx="18" fill="#ffffff" stroke="#e4e8e4"/>
  <text x="975" y="94" text-anchor="middle" font-size="13" letter-spacing="2" fill="#7f8a84" font-weight="600">无人值守身体</text>
  <text x="975" y="122" text-anchor="middle" font-size="19" fill="#182420" font-weight="700">凌晨三点的调度器</text>
  <g font-size="13.5" fill="#182420">
    <rect x="820" y="146" width="310" height="40" rx="9" fill="#eef1ee" stroke="#c9d0cb"/><text x="975" y="172" text-anchor="middle">早上之前没人看</text>
    <rect x="820" y="196" width="310" height="40" rx="9" fill="#f4f6f4"/><text x="975" y="222" text-anchor="middle">不提问 · 缺输入就停</text>
    <rect x="820" y="246" width="310" height="40" rx="9" fill="#f4f6f4"/><text x="975" y="272" text-anchor="middle">只写草稿，Agent 永不提升</text>
    <rect x="820" y="296" width="310" height="40" rx="9" fill="#f4f6f4"/><text x="975" y="322" text-anchor="middle">每次运行新会话 · 失败要响</text>
    <rect x="820" y="346" width="310" height="40" rx="9" fill="#f4f6f4"/><text x="975" y="372" text-anchor="middle">做完 = 系统可验证的状态</text>
  </g>
  <text x="975" y="408" text-anchor="middle" font-size="12.5" fill="#7f8a84">适合：托管 runtime 或调度器</text>

  <text x="600" y="456" text-anchor="middle" font-size="14" fill="#7f8a84">脑子共享 · 围绕它的规则按身体分别写</text>
</svg>
