<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f8a84"/></marker></defs>
  <rect width="1200" height="420" fill="#fbfbf9"/>
  <g font-size="13">
    <text x="300" y="44" text-anchor="middle" font-size="13" letter-spacing="2" fill="#7f8a84" font-weight="600">BEFORE</text>
    <rect x="60" y="66" width="480" height="300" rx="16" fill="#ffffff" stroke="#e4e8e4"/>
    <rect x="80" y="86" width="200" height="34" rx="8" fill="#eef1ee"/><text x="180" y="108" text-anchor="middle" fill="#182420" font-weight="600">router table</text>
