    <text x="1020" y="308" text-anchor="middle" fill="#182420" font-size="12.5" font-weight="600">routes through the tool anyway</text>
    <text x="1020" y="331" text-anchor="middle" fill="#182420" font-size="12.5" font-weight="600">logs the request shape</text>
    <text x="1020" y="351" text-anchor="middle" fill="#7f8a84" font-size="11.5">next miss = a log row, not an incident</text>
