<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a13333"/></marker></defs>
  <rect width="1200" height="420" fill="#fbfbf9"/>
  <line x1="80" y1="150" x2="1120" y2="150" stroke="#c9d0cb" stroke-width="3"/>
  <text x="80" y="128" font-size="12" fill="#7f8a84">July</text><text x="1120" y="128" text-anchor="end" font-size="12" fill="#7f8a84">September</text>
  <g font-size="13.5" fill="#182420">
    <circle cx="200" cy="150" r="10" fill="#a13333"/>
    <rect x="80" y="176" width="240" height="96" rx="12" fill="#ffffff" stroke="#e4e8e4"/>
    <text x="200" y="202" text-anchor="middle" font-weight="700">a dropped thread reply</text>
    <text x="200" y="224" text-anchor="middle" font-size="12.5" fill="#44524c">"threading bug"</text>
    <text x="200" y="252" text-anchor="middle" font-size="12.5" fill="#0e7a4d">fix: add the case to the router</text>
    <circle cx="600" cy="150" r="10" fill="#a13333"/>
    <rect x="480" y="176" width="240" height="96" rx="12" fill="#ffffff" stroke="#e4e8e4"/>
    <text x="600" y="202" text-anchor="middle" font-weight="700">a defended stale document</text>
    <text x="600" y="224" text-anchor="middle" font-size="12.5" fill="#44524c">"memory problem"</text>
    <text x="600" y="252" text-anchor="middle" font-size="12.5" fill="#0e7a4d">fix: re-fetch on re-review</text>
    <circle cx="1000" cy="150" r="10" fill="#a13333"/>
    <rect x="880" y="176" width="240" height="96" rx="12" fill="#ffffff" stroke="#e4e8e4"/>
    <text x="1000" y="202" text-anchor="middle" font-weight="700">invented code references ×2</text>
    <text x="1000" y="224" text-anchor="middle" font-size="12.5" fill="#44524c">"hallucination"</text>
    <text x="1000" y="252" text-anchor="middle" font-size="12.5" fill="#a13333" font-weight="600">about to add a rule… then: same bug</text>
  </g>
  <path d="M200 274 v40" fill="none" stroke="#a13333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <path d="M600 274 v40" fill="none" stroke="#a13333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <path d="M1000 274 v40" fill="none" stroke="#a13333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <rect x="80" y="318" width="1040" height="70" rx="14" fill="#f8e6e6" stroke="#a13333" stroke-width="2"/>
  <text x="600" y="346" text-anchor="middle" font-size="15" fill="#a13333" font-weight="700">the real cause, all three times</text>
  <text x="600" y="370" text-anchor="middle" font-size="13.5" fill="#182420">any request the router's table did not recognise fell into a generic fallback that skipped the capability built for it</text>
