<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <rect width="1200" height="380" fill="#fbfbf9"/>
  <text x="600" y="40" text-anchor="middle" font-size="14" fill="#182420" font-weight="700">the same thirty questions, two bots, one demo</text>
  <g font-size="13" fill="#182420">
    <rect x="80" y="70" width="500" height="250" rx="16" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/>
    <text x="330" y="98" text-anchor="middle" font-size="12" letter-spacing="2" fill="#0e7a4d" font-weight="600">STATIC TABLE · NO MODEL</text>
    <text x="330" y="124" text-anchor="middle" font-weight="700">4 menus · 32 answers · built in a day</text>
    <g font-size="12.5" fill="#182420">
      <text x="110" y="160">answer time</text><text x="550" y="160" text-anchor="end" font-weight="600">instant</text>
      <text x="110" y="188">wrong answers</text><text x="550" y="188" text-anchor="end" font-weight="600">none · it only has the table</text>
      <text x="110" y="216">who fixes an answer</text><text x="550" y="216" text-anchor="end" font-weight="600">the person who owns it, from chat</text>
      <text x="110" y="244">handles new phrasing</text><text x="550" y="244" text-anchor="end" fill="#a13333">no · pick from a menu</text>
      <text x="110" y="272">cost per answer</text><text x="550" y="272" text-anchor="end" font-weight="600">zero</text>
    </g>
    <rect x="270" y="288" width="120" height="24" rx="12" fill="#0e7a4d"/><text x="330" y="305" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="12">won, for this need</text>
    <rect x="620" y="70" width="500" height="250" rx="16" fill="#ffffff" stroke="#e4e8e4"/>
    <text x="870" y="98" text-anchor="middle" font-size="12" letter-spacing="2" fill="#7f8a84" font-weight="600">LLM · RETRIEVAL</text>
    <text x="870" y="124" text-anchor="middle" font-weight="700">free-text questions · built for the demo</text>
    <g font-size="12.5" fill="#182420">
      <text x="650" y="160">answer time</text><text x="1090" y="160" text-anchor="end">a second or two</text>
      <text x="650" y="188">wrong answers</text><text x="1090" y="188" text-anchor="end" fill="#a13333">once in the demo, confidently</text>
      <text x="650" y="216">who fixes an answer</text><text x="1090" y="216" text-anchor="end">an engineer re-tunes</text>
      <text x="650" y="244">handles new phrasing</text><text x="1090" y="244" text-anchor="end" font-weight="600">yes</text>
      <text x="650" y="272">cost per answer</text><text x="1090" y="272" text-anchor="end">a model call</text>
    </g>
  </g>
  <text x="600" y="352" text-anchor="middle" font-size="13" fill="#7f8a84">building both let the stakeholder see the answer instead of taking my word for it</text>
</svg>
