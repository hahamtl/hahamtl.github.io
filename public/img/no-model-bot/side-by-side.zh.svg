<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="Avenir Next, Helvetica Neue, PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <rect width="1200" height="380" fill="#fbfbf9"/>
  <text x="600" y="40" text-anchor="middle" font-size="14" fill="#182420" font-weight="700">同一批三十个问题，两个机器人，一场 demo</text>
  <g font-size="13" fill="#182420">
    <rect x="80" y="70" width="500" height="250" rx="16" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/>
    <text x="330" y="98" text-anchor="middle" font-size="12" letter-spacing="2" fill="#0e7a4d" font-weight="600">静态表 · 没有模型</text>
    <text x="330" y="124" text-anchor="middle" font-weight="700">4 个菜单 · 32 条答案 · 一天做完</text>
    <g font-size="12.5" fill="#182420">
      <text x="110" y="160">响应</text><text x="550" y="160" text-anchor="end" font-weight="600">秒回</text>
      <text x="110" y="188">答错</text><text x="550" y="188" text-anchor="end" font-weight="600">没有 · 它只有那张表</text>
      <text x="110" y="216">谁改答案</text><text x="550" y="216" text-anchor="end" font-weight="600">答案负责人，在聊天里直接改</text>
      <text x="110" y="244">处理新问法</text><text x="550" y="244" text-anchor="end" fill="#a13333">不能 · 从菜单选</text>
      <text x="110" y="272">每次成本</text><text x="550" y="272" text-anchor="end" font-weight="600">零</text>
    </g>
    <rect x="270" y="288" width="120" height="24" rx="12" fill="#0e7a4d"/><text x="330" y="305" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="12">这个需求下，赢</text>
    <rect x="620" y="70" width="500" height="250" rx="16" fill="#ffffff" stroke="#e4e8e4"/>
    <text x="870" y="98" text-anchor="middle" font-size="12" letter-spacing="2" fill="#7f8a84" font-weight="600">LLM · 检索</text>
    <text x="870" y="124" text-anchor="middle" font-weight="700">自由提问 · 为 demo 专门做的</text>
    <g font-size="12.5" fill="#182420">
      <text x="650" y="160">响应</text><text x="1090" y="160" text-anchor="end">一两秒</text>
      <text x="650" y="188">答错</text><text x="1090" y="188" text-anchor="end" fill="#a13333">demo 里错了一次，很自信</text>
      <text x="650" y="216">谁改答案</text><text x="1090" y="216" text-anchor="end">工程师重新调</text>
      <text x="650" y="244">处理新问法</text><text x="1090" y="244" text-anchor="end" font-weight="600">能</text>
      <text x="650" y="272">每次成本</text><text x="1090" y="272" text-anchor="end">一次模型调用</text>
    </g>
  </g>
  <text x="600" y="352" text-anchor="middle" font-size="13" fill="#7f8a84">两个都做，业务方自己看出答案，不用听我说</text>
</svg>
