<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <rect width="1200" height="400" fill="#fbfbf9"/>
  <g font-size="12" fill="#7f8a84"><text x="80" y="60">2014</text><text x="1120" y="60" text-anchor="end">2026</text></g>
  <g font-size="14" fill="#182420">
    <rect x="80" y="76" width="240" height="120" rx="14" fill="#ffffff" stroke="#e4e8e4"/>
    <text x="200" y="104" text-anchor="middle" font-size="12" letter-spacing="2" fill="#7f8a84" font-weight="600">ERA 1</text>
    <text x="200" y="130" text-anchor="middle" font-weight="700">automation frameworks</text>
    <text x="200" y="154" text-anchor="middle" font-size="12.5" fill="#44524c">friction: repetition</text>
    <text x="200" y="176" text-anchor="middle" font-size="12.5" fill="#7f8a84">success: someone else committed</text>
    <rect x="346" y="76" width="240" height="120" rx="14" fill="#ffffff" stroke="#e4e8e4"/>
    <text x="466" y="104" text-anchor="middle" font-size="12" letter-spacing="2" fill="#7f8a84" font-weight="600">ERA 2</text>
    <text x="466" y="130" text-anchor="middle" font-weight="700">tooling · shared services</text>
    <text x="466" y="154" text-anchor="middle" font-size="12.5" fill="#44524c">friction: access</text>
    <text x="466" y="176" text-anchor="middle" font-size="12.5" fill="#7f8a84">success: someone else depended on it</text>
    <rect x="612" y="76" width="240" height="120" rx="14" fill="#ffffff" stroke="#e4e8e4"/>
    <text x="732" y="104" text-anchor="middle" font-size="12" letter-spacing="2" fill="#7f8a84" font-weight="600">ERA 3</text>
    <text x="732" y="130" text-anchor="middle" font-weight="700">platform · tool server</text>
    <text x="732" y="154" text-anchor="middle" font-size="12.5" fill="#44524c">friction: the seams</text>
    <text x="732" y="176" text-anchor="middle" font-size="12.5" fill="#7f8a84">success: someone else integrated</text>
    <rect x="878" y="76" width="242" height="120" rx="14" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/>
    <text x="999" y="104" text-anchor="middle" font-size="12" letter-spacing="2" fill="#0e7a4d" font-weight="600">ERA 4</text>
    <text x="999" y="130" text-anchor="middle" font-weight="700">AI agents</text>
    <text x="999" y="154" text-anchor="middle" font-size="12.5" fill="#44524c">friction: pace</text>
    <text x="999" y="176" text-anchor="middle" font-size="12.5" fill="#7f8a84">success: someone kept the draft</text>
  </g>
  <g font-size="11.5" fill="#7f8a84">
    <text x="200" y="222" text-anchor="middle">test automation developer</text>
    <text x="466" y="222" text-anchor="middle">senior automation · SDET</text>
    <text x="732" y="222" text-anchor="middle">senior SDET · tooling owner</text>
    <text x="999" y="222" text-anchor="middle">staff engineer · AI enablement</text>
  </g>
  <rect x="80" y="262" width="1040" height="6" rx="3" fill="#0e7a4d"/>
  <text x="600" y="306" text-anchor="middle" font-size="17" fill="#182420" font-weight="700">find the friction between people and their systems, and remove it</text>
  <text x="600" y="330" text-anchor="middle" font-size="13" fill="#7f8a84">four titles on top · one line underneath</text>
  <text x="600" y="372" text-anchor="middle" font-size="12.5" fill="#7f8a84">the tools changed: scripts → frameworks → services → interfaces → agents · the job did not</text>
</svg>
