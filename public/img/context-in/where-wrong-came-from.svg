<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <rect width="1200" height="300" fill="#fbfbf9"/>
  <text x="80" y="50" font-size="15" fill="#182420" font-weight="700">Where the wrong answers I investigated actually came from</text>
  <text x="80" y="72" font-size="12.5" fill="#7f8a84">rough tally across three systems over a year · proportions, not a measurement</text>
  <g font-size="13" fill="#ffffff" font-weight="600">
    <rect x="80" y="100" width="300" height="70" fill="#0e7a4d"/><text x="230" y="140" text-anchor="middle">missing</text>
    <rect x="380" y="100" width="210" height="70" fill="#3c9a6c"/><text x="485" y="140" text-anchor="middle">tangled</text>
    <rect x="590" y="100" width="180" height="70" fill="#7bbf9a"/><text x="680" y="140" text-anchor="middle" fill="#182420">misread layout</text>
    <rect x="770" y="100" width="190" height="70" fill="#a06b12"/><text x="865" y="140" text-anchor="middle">a tool lied</text>
    <rect x="960" y="100" width="130" height="70" fill="#e5cf9c"/><text x="1025" y="140" text-anchor="middle" fill="#182420">rule unseen</text>
    <rect x="1090" y="100" width="30" height="70" fill="#a13333"/>
  </g>
  <path d="M1105 96 v-14" stroke="#a13333" stroke-width="1.5"/><text x="1105" y="76" text-anchor="middle" font-size="12" fill="#a13333" font-weight="700">the model</text>
  <g font-size="12.5" fill="#44524c">
    <text x="80" y="204">missing · the data was never loaded, or was silently cut</text>
    <text x="80" y="226">tangled · two partners, two work items, one conversation</text>
    <text x="80" y="248">misread layout · a table pasted as prose, a special case listed first</text>
    <text x="640" y="204">a tool lied · zero results, a stub instead of the record</text>
    <text x="640" y="226">rule unseen · lived in a file not loaded that turn</text>
    <text x="640" y="248" fill="#a13333">the model · the sliver on the right</text>
  </g>
  <rect x="80" y="270" width="1040" height="1" fill="#e4e8e4"/>
</svg>
