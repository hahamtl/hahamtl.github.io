<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="Avenir Next, Helvetica Neue, PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <rect width="1200" height="300" fill="#fbfbf9"/>
  <text x="80" y="50" font-size="15" fill="#182420" font-weight="700">我查过的错误答案，实际来自哪里</text>
  <text x="80" y="72" font-size="12.5" fill="#7f8a84">一年、三个系统的粗略记账 · 是比例感，不是测量</text>
  <g font-size="13" fill="#ffffff" font-weight="600">
    <rect x="80" y="100" width="300" height="70" fill="#0e7a4d"/><text x="230" y="140" text-anchor="middle">缺了</text>
    <rect x="380" y="100" width="210" height="70" fill="#3c9a6c"/><text x="485" y="140" text-anchor="middle">搅在一起</text>
    <rect x="590" y="100" width="180" height="70" fill="#7bbf9a"/><text x="680" y="140" text-anchor="middle" fill="#182420">排法读歪</text>
    <rect x="770" y="100" width="190" height="70" fill="#a06b12"/><text x="865" y="140" text-anchor="middle">工具说谎</text>
    <rect x="960" y="100" width="130" height="70" fill="#e5cf9c"/><text x="1025" y="140" text-anchor="middle" fill="#182420">规则没读到</text>
    <rect x="1090" y="100" width="30" height="70" fill="#a13333"/>
  </g>
  <path d="M1105 96 v-14" stroke="#a13333" stroke-width="1.5"/><text x="1105" y="76" text-anchor="middle" font-size="12" fill="#a13333" font-weight="700">模型</text>
  <g font-size="12.5" fill="#44524c">
    <text x="80" y="204">缺了 · 数据没加载，或被悄悄砍掉</text>
    <text x="80" y="226">搅在一起 · 两个 partner、两个工单，一段对话</text>
    <text x="80" y="248">排法读歪 · 表贴成段落，特例排在通用规则前</text>
    <text x="640" y="204">工具说谎 · 零结果，空壳代替记录</text>
    <text x="640" y="226">规则没读到 · 住在那一轮没加载的文件里</text>
    <text x="640" y="248" fill="#a13333">模型 · 最右边那一小条</text>
  </g>
  <rect x="80" y="270" width="1040" height="1" fill="#e4e8e4"/>
</svg>
