<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="Avenir Next, Helvetica Neue, PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f8a84"/></marker></defs>
  <rect width="1200" height="380" fill="#fbfbf9"/>
  <text x="300" y="44" text-anchor="middle" font-size="13" letter-spacing="2" fill="#a13333" font-weight="600">之前 · 两个状态来源</text>
  <g font-size="13" fill="#182420">
    <rect x="80" y="70" width="200" height="54" rx="10" fill="#182420"/><text x="180" y="93" text-anchor="middle" fill="#ffffff" font-weight="600">任务</text><text x="180" y="112" text-anchor="middle" fill="#cfd8d3" font-size="12">在跑，已经四分钟</text>
    <rect x="80" y="150" width="200" height="54" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="180" y="173" text-anchor="middle" font-weight="600">运行记录 A</text><text x="180" y="192" text-anchor="middle" fill="#44524c" font-size="12">状态 = 运行中</text>
    <rect x="320" y="150" width="200" height="54" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="420" y="173" text-anchor="middle" font-weight="600">记录 B（确认框读的）</text><text x="420" y="192" text-anchor="middle" fill="#44524c" font-size="12">状态 = 未开始</text>
    <rect x="320" y="230" width="200" height="54" rx="10" fill="#f8e6e6" stroke="#a13333" stroke-width="2"/><text x="420" y="253" text-anchor="middle" fill="#a13333" font-weight="700">"尚未开始，</text><text x="420" y="272" text-anchor="middle" fill="#a13333" font-weight="700">请批准"</text>
    <path d="M180 126 v22" fill="none" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M420 206 v22" fill="none" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="80" y="230" width="200" height="54" rx="10" fill="#faf0da" stroke="#a06b12"/><text x="180" y="253" text-anchor="middle" font-weight="600">用户</text><text x="180" y="272" text-anchor="middle" fill="#44524c" font-size="12">再批准一次 · 付了两次</text>
    <path d="M318 257 h-36" fill="none" stroke="#a13333" stroke-width="1.6" marker-end="url(#a)"/>
  </g>
  <text x="300" y="330" text-anchor="middle" font-size="12.5" fill="#7f8a84">两份记录各自都没错 · 用户只看到一份</text>
  <line x1="600" y1="40" x2="600" y2="340" stroke="#e4e8e4"/>
  <text x="900" y="44" text-anchor="middle" font-size="13" letter-spacing="2" fill="#0e7a4d" font-weight="600">之后 · 一个函数</text>
  <g font-size="13" fill="#182420">
    <rect x="780" y="140" width="240" height="60" rx="12" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/><text x="900" y="165" text-anchor="middle" font-weight="700" font-family="ui-monospace, SF Mono, Menlo, monospace">runState(id)</text><text x="900" y="186" text-anchor="middle" fill="#44524c" font-size="12">读状态的唯一地方</text>
    <rect x="660" y="240" width="150" height="50" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="735" y="270" text-anchor="middle">启动器</text>
    <rect x="825" y="240" width="150" height="50" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="900" y="270" text-anchor="middle">确认框</text>
    <rect x="990" y="240" width="150" height="50" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="1065" y="270" text-anchor="middle">状态行</text>
    <path d="M735 238 v-20 H900 v-16" fill="none" stroke="#0e7a4d" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M900 238 v-36" fill="none" stroke="#0e7a4d" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M1065 238 v-20 H900" fill="none" stroke="#0e7a4d" stroke-width="1.6"/>
    <rect x="740" y="70" width="320" height="46" rx="10" fill="#ffffff" stroke="#0e7a4d"/><text x="900" y="90" text-anchor="middle" font-size="12.5" font-weight="600">最后一次更新 = 一条不会失败的短消息</text><text x="900" y="107" text-anchor="middle" font-size="11.5" fill="#44524c">长总结之后再附上</text>
  </g>
  <text x="900" y="330" text-anchor="middle" font-size="12.5" fill="#7f8a84">提示和任务在结构上不可能不一致</text>
</svg>
