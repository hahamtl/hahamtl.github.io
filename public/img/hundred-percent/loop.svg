<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f8a84"/></marker></defs>
  <rect width="1200" height="400" fill="#fbfbf9"/>
  <text x="80" y="44" font-size="13" letter-spacing="2" fill="#7f8a84" font-weight="600">THE LOOP · FIXED AND BORING</text>
  <g font-size="12.5" fill="#182420">
    <rect x="80" y="66" width="160" height="56" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="160" y="90" text-anchor="middle" font-weight="600">run tests locally</text><text x="160" y="108" text-anchor="middle" fill="#44524c" font-size="11.5">with coverage on</text>
    <path d="M242 94 h24" fill="none" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="268" y="66" width="160" height="56" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="348" y="90" text-anchor="middle" font-weight="600">read the report</text><text x="348" y="108" text-anchor="middle" fill="#44524c" font-size="11.5">changed methods, zero hits</text>
    <path d="M430 94 h24" fill="none" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="456" y="66" width="160" height="56" rx="10" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/><text x="536" y="90" text-anchor="middle" font-weight="700">one test per branch</text><text x="536" y="108" text-anchor="middle" fill="#44524c" font-size="11.5">named for the branch</text>
    <path d="M618 94 h24" fill="none" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="644" y="66" width="120" height="56" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="704" y="99" text-anchor="middle" font-weight="600">push</text>
    <path d="M766 94 h24" fill="none" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="792" y="66" width="160" height="56" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="872" y="90" text-anchor="middle" font-weight="600">wait for the scan</text><text x="872" y="108" text-anchor="middle" fill="#44524c" font-size="11.5">poll the gate once a minute</text>
    <path d="M954 94 h24" fill="none" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="980" y="66" width="140" height="56" rx="10" fill="#0e7a4d"/><text x="1050" y="90" text-anchor="middle" fill="#ffffff" font-weight="700">green</text><text x="1050" y="108" text-anchor="middle" fill="#dff0e7" font-size="11.5">now ask for review</text>
    <path d="M1050 124 v26 H536 v-2" fill="none" stroke="#a13333" stroke-width="1.4" stroke-dasharray="5 4"/><text x="793" y="166" text-anchor="middle" font-size="11.5" fill="#a13333">red → back to the branch that is still uncovered</text>
  </g>
  <text x="80" y="214" font-size="13" letter-spacing="2" fill="#7f8a84" font-weight="600">ONE PULL REQUEST</text>
  <g font-size="12.5" fill="#182420">
    <text x="80" y="246">first scan</text>
    <rect x="200" y="232" width="920" height="22" rx="6" fill="#eef1ee"/><rect x="200" y="232" width="347" height="22" rx="6" fill="#a06b12"/><text x="560" y="248" font-size="12" fill="#a13333" font-weight="700">37.7% · 3 of 8 branches · 1 finding</text>
    <text x="80" y="296">after 12 tests</text>
    <rect x="200" y="282" width="920" height="22" rx="6" fill="#0e7a4d"/><text x="1108" y="298" text-anchor="end" font-size="12" fill="#ffffff" font-weight="700">100% · 8 of 8 · 0 findings · about an hour</text>
    <text x="200" y="336" fill="#44524c" font-size="12">the five branches nobody had thought about:</text>
    <g font-size="12" fill="#182420">
      <rect x="200" y="346" width="150" height="26" rx="13" fill="#ffffff" stroke="#c9d0cb"/><text x="275" y="364" text-anchor="middle">downstream call fails</text>
      <rect x="360" y="346" width="150" height="26" rx="13" fill="#ffffff" stroke="#c9d0cb"/><text x="435" y="364" text-anchor="middle">optional field is null</text>
      <rect x="520" y="346" width="150" height="26" rx="13" fill="#ffffff" stroke="#c9d0cb"/><text x="595" y="364" text-anchor="middle">parameter not provided</text>
      <rect x="680" y="346" width="130" height="26" rx="13" fill="#ffffff" stroke="#c9d0cb"/><text x="745" y="364" text-anchor="middle">lower boundary</text>
      <rect x="820" y="346" width="130" height="26" rx="13" fill="#ffffff" stroke="#c9d0cb"/><text x="885" y="364" text-anchor="middle">upper boundary</text>
    </g>
